id: s1-ablation-driver
kind: node
provides: [s1_ablation_starter]
requires: [order_reading, task_planning, waypoint_navigation]
inputs:
  order: {schema: json_utf8, rate_hz: 1}
  subtask_plan: {schema: json_utf8, rate_hz: 1}
  poses: {schema: posearray7d_f32, rate_hz: 15}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  base_pose: {schema: base_pose3d_f32, rate_hz: 50}
  nav_result: {schema: json_utf8, rate_hz: 1}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
outputs:
  nav_goal: {schema: json_utf8, latency_class: best_effort}
  joint_cmd: {schema: jointvec_f32, latency_class: hard_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: hard_rt}
embodiment:
  arm: [franka]
  gripper: any
  base: [mobile]
# ADR-5 (ratified 2026-08-03): motion means EMITS ACTUATION COMMANDS, and
# this driver emits joint_cmd/gripper_cmd at hard_rt.
safety_class: motion
eval:
  suite: tests/graph/test_s1_ablation_starters.py (typed starter conformance + safety topology)
  pass_rate: 1.0
  last_run: '2026-08-06'
origin: hub
source: src/aisle/nodes/s1_ablation_driver.py
