id: script-s1-runtime
kind: node
provides: [script_s1_policy_runtime]
requires: [waypoint_navigation]
inputs:
  episode_goal: {schema: json_utf8, rate_hz: 1}
  poses: {schema: posearray7d_f32, rate_hz: 15}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  base_pose: {schema: base_pose3d_f32, rate_hz: 50}
  nav_result: {schema: json_utf8, rate_hz: 1}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
outputs:
  nav_goal: {schema: json_utf8, latency_class: best_effort}
  joint_cmd: {schema: jointvec_f32, latency_class: hard_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: hard_rt}
  policy_event: {schema: json_utf8, latency_class: best_effort}
embodiment:
  arm: [franka]
  gripper: any
  base: [mobile]
# ADR-5 (ratified 2026-08-03): motion means EMITS ACTUATION COMMANDS, and
# this runtime emits joint_cmd/gripper_cmd at hard_rt.
safety_class: motion
# 0/1 as of the last run: the suite's single case asserts the starter's
# nav payload carries `target`, but S1StarterStateMachine emits `location`
# (s1_ablation_common.py:76). Pre-existing, reproduced on the pre-merge
# tree — recorded honestly rather than backfilled from the passing unit
# twin (test_script_wrapper_routes_every_motion_command_through_budget_guard).
eval:
  suite: tests/graph/test_s1_script_wrapper.py (script wrapper guard routing)
  pass_rate: 0.0
  last_run: '2026-08-06'
origin: hub
source: src/aisle/nodes/script_s1_runtime.py
